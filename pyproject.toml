[project]
name = "kle-fetch"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "mypy>=1.18.2",
    "pydantic>=2.12.4",
    "pylsp-mypy>=0.7.0",
    "ruff>=0.14.6",
    "xmltodict>=1.0.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pylsp-rope>=0.1.17",
    "python-lsp-ruff>=2.3.0",
]
